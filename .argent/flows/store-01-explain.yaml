# The lesson's own home page. Three taps used to drive into the bars visual, and every one of
# them was a failure mode: the CTA moved between builds, a first-run coach-mark scrimmed the
# screen, and the row tap landed mid-transition. The intro page already carries the promise --
# lesson title, objective, progress -- and it captures deterministically with no interaction.
steps:
  - tool: restart-app
    args:
      bundleId: com.euphoriainv.euphoria
  - wait: 2000
  - tool: open-url
    args:
      url: "euphorianative://lesson?course=investing-fundamentals&num=1"
  - wait: 5000
